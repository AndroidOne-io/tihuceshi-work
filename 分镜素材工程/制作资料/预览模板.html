<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><title>鹈鹕测试 · 双轨工程</title><style>
*{box-sizing:border-box}body{margin:0;background:#11191f;color:#eaf0f3;font:15px system-ui}main{max-width:1300px;margin:auto;padding:26px}h1{font-size:25px;margin:0 0 8px}.muted{color:#a0b0bb}a{color:#9de2cb}button,input{font:inherit}button{background:#263944;color:#fff;border:1px solid #48616e;border-radius:7px;padding:8px 16px;cursor:pointer}button:hover{background:#3a5360}.bar{display:flex;gap:12px;align-items:center;margin:16px 0}.stage{aspect-ratio:16/9;background:#000;position:relative;max-height:660px;margin:auto}.stage video,.stage img{width:100%;height:100%;object-fit:contain;position:absolute;inset:0}.stage #overlay,.stage #still{z-index:2}.hidden{display:none}#seek{width:100%}.track{height:50px;position:relative;background:#1e2a32;margin:8px 0 20px;overflow:hidden}.clip{position:absolute;top:4px;height:42px;background:#366c62;border:1px solid #76a796;border-radius:4px;font-size:12px;overflow:hidden;padding:5px;cursor:pointer;color:white}.narr{background:#355371}.playhead{position:absolute;top:0;bottom:0;border-left:2px solid #ffe29a;pointer-events:none}.trackname{font-size:13px;color:#b0c0ca}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #30424c}tr:hover{background:#20313b}td input{width:76px;background:#17252d;color:white;border:1px solid #46606d;padding:5px}summary{cursor:pointer;padding:15px 0}#status{color:#cfece0;min-height:23px}.links{display:flex;gap:20px;flex-wrap:wrap}.note{line-height:1.7;max-width:1000px}
</style><main><h1>鹈鹕测试 · 分镜双轨工程</h1><div class="muted">30 fps · 4K 时间轴 · 口播与素材分轨 · 分镜编号对应飞书表格左侧行号</div><div class="bar"><button id="play">播放</button><button id="back">后退 5 秒</button><button id="next">前进 5 秒</button><span id="clock"></span><button id="save">保存调整后的工程 JSON</button></div><div class="stage"><video id="narration" playsinline preload="auto" src="口播粗剪.mp4"></video><video id="overlay" class="hidden" playsinline preload="auto"></video><img id="still" class="hidden"></div><div id="status"></div><input id="seek" type="range" min="0" step="0.0333333333"><div class="trackname">素材轨道 · 点击片段定位</div><div id="assetTrack" class="track"></div><div class="trackname">口播轨道 · 已剪好的口播，独立插入段让位</div><div id="narrTrack" class="track"></div><div class="links"><a href="鹈鹕测试_分镜双轨.fcpxml">FCPXML 可编辑工程</a><a href="时间轴清单.csv">时间轴清单</a><a href="素材来源清单.json">素材来源清单</a><a href="工程.json">原始工程 JSON</a></div><p class="muted note">第 15 行指定的 11–20 秒恶搞素材单独插入 9 秒，后续口播顺延。其他素材静音。播放由本地源文件实时组合，未导出合成视频。下方可调整素材开始时间和源入点；调整后保存 JSON，再运行制作资料中的交付工程.py 可更新 FCPXML。</p><details><summary>展开素材片段与可调剪点</summary><table><thead><tr><th>分镜行号</th><th>素材文件</th><th>开始/秒</th><th>时长/秒</th><th>源入点/秒</th><th>定位</th></tr></thead><tbody id="rows"></tbody></table></details></main>
<script>
const P=__DATA__,fps=30,D=P.duration_frames/fps,n=document.querySelector('#narration'),o=document.querySelector('#overlay'),im=document.querySelector('#still'),seek=document.querySelector('#seek'),btn=document.querySelector('#play');seek.max=D;let pos=0,playing=false,last=0,active=null;const cut=P.insert_frame/fps,gap=P.insert_duration_frames/fps;
const fmt=t=>`${Math.floor(t/60).toString().padStart(2,'0')}:${(t%60).toFixed(2).padStart(5,'0')}`;
function renderTracks(){for(const id of ['assetTrack','narrTrack'])document.getElementById(id).replaceChildren();for(const c of P.clips){const el=document.createElement('div');el.className='clip';el.style.left=c.start_frame/fps/D*100+'%';el.style.width=c.duration_frames/fps/D*100+'%';el.textContent=c.row;el.title=c.name;el.onclick=()=>jump(c.start_frame/fps);document.querySelector('#assetTrack').append(el)}for(const [s,e] of [[0,cut],[cut+gap,D]]){const el=document.createElement('div');el.className='clip narr';el.style.left=s/D*100+'%';el.style.width=(e-s)/D*100+'%';el.textContent='口播';document.querySelector('#narrTrack').append(el)}for(const id of ['assetTrack','narrTrack']){let x=document.createElement('div');x.className='playhead';document.getElementById(id).append(x)}}
function playMedia(v,want){if(want&&v.paused)v.play().catch(()=>{});else if(!want&&!v.paused)v.pause()}
function sync(force=false){const inGap=pos>=cut&&pos<cut+gap,nt=pos<cut?pos:pos-gap;const c=P.clips.find(c=>pos>=c.start_frame/fps&&pos<(c.start_frame+c.duration_frames)/fps);n.style.visibility=inGap?'hidden':'visible';if(!inGap&&!n.seeking&&(force||Math.abs(n.currentTime-nt)>.18))n.currentTime=Math.max(0,nt);playMedia(n,playing&&!inGap);if(c!==active){o.pause();active=c;o.classList.add('hidden');im.classList.add('hidden');if(c){if(/\.mp4$/i.test(c.file)){o.src=c.file;o.muted=!c.audio;o.classList.remove('hidden')}else{im.src=c.file;im.classList.remove('hidden')}}}
if(c&&/\.mp4$/i.test(c.file)){const ot=c.source_frame/fps+pos-c.start_frame/fps;if(!o.seeking&&(force||Math.abs(o.currentTime-ot)>.18))o.currentTime=Math.max(0,ot);playMedia(o,playing)}document.querySelector('#status').textContent=c?`分镜 ${c.row} · ${c.name}`:'口播画面';document.querySelector('#clock').textContent=fmt(pos)+' / '+fmt(D);seek.value=pos;document.querySelectorAll('.playhead').forEach(x=>x.style.left=pos/D*100+'%')}
function jump(t){pos=Math.max(0,Math.min(D,t));last=performance.now();sync(true)}
function setPlay(v){playing=v;last=performance.now();btn.textContent=v?'暂停':'播放';sync()}
function tick(now){if(playing){const gapNow=pos>=cut&&pos<cut+gap;const ready=gapNow?(o.readyState>=3&&!o.seeking):(n.readyState>=3&&!n.seeking);if(ready)pos=Math.min(D,pos+(now-last)/1000);if(pos>=D)setPlay(false);sync()}last=now;requestAnimationFrame(tick)}
btn.onclick=()=>setPlay(!playing);document.querySelector('#back').onclick=()=>jump(pos-5);document.querySelector('#next').onclick=()=>jump(pos+5);seek.oninput=()=>jump(+seek.value);document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='INPUT'){e.preventDefault();setPlay(!playing)}});
const tbody=document.querySelector('#rows');P.clips.forEach(c=>{const tr=document.createElement('tr');const row=document.createElement('td');row.textContent=c.row;tr.append(row);const file=document.createElement('td');const a=document.createElement('a');a.href=c.file;a.textContent=c.file;a.target='_blank';file.append(a);tr.append(file);for(const key of ['start_frame','duration_frames','source_frame']){const td=document.createElement('td'),input=document.createElement('input');input.type='number';input.min=0;input.step=1/fps;input.value=(c[key]/fps).toFixed(3);input.onchange=()=>{c[key]=Math.round(+input.value*fps);renderTracks();sync(true)};td.append(input);tr.append(td)}const td=document.createElement('td'),b=document.createElement('button');b.textContent='查看';b.onclick=()=>jump(c.start_frame/fps);td.append(b);tr.append(td);tbody.append(tr)});
document.querySelector('#save').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(P,null,2)],{type:'application/json'}));a.download='工程.json';a.click();URL.revokeObjectURL(a.href)};renderTracks();sync(true);requestAnimationFrame(tick);
</script></html>
